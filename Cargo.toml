[workspace]
resolver = "2"
members = [
    "crates/mimir-types",
    # M2: Graph crates
    "crates/mimir-parse-core",
    "crates/mimir-parse-rust",
    "crates/mimir-graph",
    "crates/mimir-resolve",
    "crates/mimir-resolve-ra",
    # M3: Actor crates
    "crates/mimir-edit",
    "crates/mimir-protocol",
    "crates/mimir-engine",
    "crates/mimir-daemon",
    "crates/mimir-client",
    # CLI
    "crates/mimir-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["JuliusML"]
license = "MIT"
repository = "https://github.com/JuliusML/Mimir"

[workspace.dependencies]
# Internal crates - Layer 0
mimir-types = { path = "crates/mimir-types" }

# Internal crates - Layer 2 (Parsing)
mimir-parse-core = { path = "crates/mimir-parse-core" }
mimir-parse-rust = { path = "crates/mimir-parse-rust" }

# Internal crates - Layer 3
mimir-graph = { path = "crates/mimir-graph" }
mimir-resolve = { path = "crates/mimir-resolve" }
mimir-resolve-ra = { path = "crates/mimir-resolve-ra" }
mimir-edit = { path = "crates/mimir-edit" }
mimir-protocol = { path = "crates/mimir-protocol" }
mimir-engine = { path = "crates/mimir-engine" }
mimir-daemon = { path = "crates/mimir-daemon" }
mimir-client = { path = "crates/mimir-client" }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hashing
blake3 = "1.8"

# Concurrency
dashmap = "6.1"
tokio = { version = "1.48", features = ["full"] }
arc-swap = "1.7"

# Graph
petgraph = "0.6"

# Regex
regex = "1.10"

# Parsing
tree-sitter = "0.24"
tree-sitter-rust = "0.23"

# CLI
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
ignore = "0.4"
tempfile = "3.14"
notify = { version = "7.0", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.5"

# Testing
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
