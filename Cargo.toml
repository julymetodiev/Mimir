[workspace]
resolver = "2"
members = [
    "crates/mimir-types",
    # M2: Graph crates
    "crates/mimir-parse-core",
    "crates/mimir-parse-rust",
    "crates/mimir-graph",
    "crates/mimir-resolve",
    "crates/mimir-resolve-ra",
    # M3: Actor crates
    "crates/mimir-edit",
    "crates/mimir-protocol",
    "crates/mimir-engine",
    "crates/mimir-daemon",
    "crates/mimir-client",
    "crates/mimir-mcp",
    "crates/mimir-view-wire",
    "crates/mimir-view",
    "crates/mimir-view-page",
    # CLI
    "crates/mimir-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["JuliusML"]
license = "MIT"
repository = "https://github.com/julymetodiev/Mimir"

[workspace.dependencies]
# Internal crates - Layer 0
mimir-types = { path = "crates/mimir-types" }

# Internal crates - Layer 2 (Parsing)
mimir-parse-core = { path = "crates/mimir-parse-core" }
mimir-parse-rust = { path = "crates/mimir-parse-rust" }

# Internal crates - Layer 3
mimir-graph = { path = "crates/mimir-graph" }
mimir-resolve = { path = "crates/mimir-resolve" }
mimir-resolve-ra = { path = "crates/mimir-resolve-ra" }
mimir-edit = { path = "crates/mimir-edit" }
mimir-protocol = { path = "crates/mimir-protocol" }
mimir-engine = { path = "crates/mimir-engine" }
mimir-daemon = { path = "crates/mimir-daemon" }
mimir-client = { path = "crates/mimir-client" }
mimir-mcp = { path = "crates/mimir-mcp" }
mimir-view = { path = "crates/mimir-view" }
mimir-view-wire = { path = "crates/mimir-view-wire" }

# MCP
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Hashing
blake3 = "1.8.7"

# Concurrency
dashmap = "6.2.1"
tokio = { version = "1.54.1", features = ["full"] }
arc-swap = "1.9.3"

# Graph
petgraph = "0.8.3"

# Regex
regex = "1.13.1"

# Parsing
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"

# CLI
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
ignore = "0.4.34"
tempfile = "3.27.0"
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
notify-debouncer-mini = "0.7.0"

# Testing
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
