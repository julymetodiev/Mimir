[workspace]
resolver = "2"
members = [
    "crates/mimir-types",
    "crates/mimir-error",
    "crates/mimir-persist",
    "crates/mimir-cache",
    "crates/mimir-content",
    "crates/mimir-snapshot",
    "crates/mimir-files",
    "crates/mimir-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
authors = ["JuliusML"]
license = "MIT"
repository = "https://github.com/JuliusML/Mimir"

[workspace.dependencies]
# Internal crates - Layer 0
mimir-types = { path = "crates/mimir-types" }
mimir-error = { path = "crates/mimir-error" }

# Internal crates - Layer 1
mimir-persist = { path = "crates/mimir-persist" }
mimir-cache = { path = "crates/mimir-cache" }
mimir-content = { path = "crates/mimir-content" }
mimir-snapshot = { path = "crates/mimir-snapshot" }

# Internal crates - Layer 3 (partial)
mimir-files = { path = "crates/mimir-files" }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { version = "2.0.0-rc.3", features = ["serde"] }
toml = "0.8"

# Hashing and compression
blake3 = "1.8"
zstd = "0.13"

# Concurrency
dashmap = "6.1"
tokio = { version = "1.48", features = ["full"] }
async-trait = "0.1"

# Caching
moka = { version = "0.12", features = ["sync"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
ignore = "0.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
tempfile = "3.14"

# Testing
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
