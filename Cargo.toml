[workspace]
resolver = "2"
members = [
    "crates/latt-types",
    # M2: Graph crates
    "crates/latt-parse-core",
    "crates/latt-parse-rust",
    "crates/latt-parse-ts",
    "crates/latt-parse-python",
    "crates/latt-parse-go",
    "crates/latt-parse-c",
    "crates/latt-graph",
    "crates/latt-graph-fb",
    "crates/latt-resolve",
    "crates/latt-lsp",
    "crates/latt-resolve-scip",
    "crates/latt-resolve-ra",
    "crates/latt-resolve-go",
    "crates/latt-resolve-clang",
    "crates/latt-resolve-lsp",
    # M3: Actor crates
    "crates/latt-edit",
    "crates/latt-protocol",
    "crates/latt-engine",
    "crates/latt-daemon",
    "crates/latt-client",
    "crates/latt-hook",
    "crates/latt-mcp",
    "crates/latt-view-wire",
    "crates/latt-view",
    "crates/latt-view-page",
    # CLI
    "crates/latt-cli",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.95"
authors = ["JuliusML"]
license = "MIT"
repository = "https://github.com/julymetodiev/lantern-lattice"

[workspace.dependencies]
# Internal crates - Layer 0
latt-types = { path = "crates/latt-types" }

# Internal crates - Layer 2 (Parsing)
latt-parse-core = { path = "crates/latt-parse-core" }
latt-parse-rust = { path = "crates/latt-parse-rust" }
latt-parse-ts = { path = "crates/latt-parse-ts" }
latt-parse-python = { path = "crates/latt-parse-python" }
latt-parse-go = { path = "crates/latt-parse-go" }
latt-parse-c = { path = "crates/latt-parse-c" }

# Internal crates - Layer 3
latt-graph = { path = "crates/latt-graph" }
latt-graph-fb = { path = "crates/latt-graph-fb" }
latt-resolve = { path = "crates/latt-resolve" }
latt-lsp = { path = "crates/latt-lsp" }
latt-resolve-scip = { path = "crates/latt-resolve-scip" }
latt-resolve-ra = { path = "crates/latt-resolve-ra" }
latt-resolve-go = { path = "crates/latt-resolve-go" }
latt-resolve-clang = { path = "crates/latt-resolve-clang" }
latt-resolve-lsp = { path = "crates/latt-resolve-lsp" }
latt-edit = { path = "crates/latt-edit" }
latt-protocol = { path = "crates/latt-protocol" }
latt-engine = { path = "crates/latt-engine" }
latt-daemon = { path = "crates/latt-daemon" }
latt-client = { path = "crates/latt-client" }
latt-hook = { path = "crates/latt-hook" }
latt-mcp = { path = "crates/latt-mcp" }
latt-view = { path = "crates/latt-view" }
latt-view-wire = { path = "crates/latt-view-wire" }

# MCP
rmcp = { version = "3.9", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Hashing
blake3 = "1.8.7"

# Concurrency
dashmap = "6.2.1"
flatbuffers = "25.12.19"
self_cell = "1.3.0"
tokio = { version = "1.54.1", features = ["full"] }
arc-swap = "1.9.3"

# Graph

# Regex
regex = "1.13.1"

# Parsing
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"

# CLI
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4.45", features = ["serde"] }
hex = "0.4.3"
ignore = "0.4.34"
tempfile = "3.27.0"
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }

# Testing
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
