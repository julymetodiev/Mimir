<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Mimir: a call graph growing as a tree out of a well</title>
  <rect width="512" height="512" rx="96" fill="#0F172A"/>
  <!-- The well -->
  <path d="M136 372 V404 C136 434 190 452 256 452 C322 452 376 434 376 404 V372" stroke="#475569" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="256" cy="372" rx="120" ry="38" stroke="#94A3B8" stroke-width="14"/>
  <!-- The tree: calls branching from one root -->
  <g stroke="#64748B" stroke-width="14" stroke-linecap="round">
    <path d="M256 372 V262"/>
    <path d="M256 262 L156 176"/>
    <path d="M256 262 L356 176"/>
    <path d="M156 176 L108 92"/>
    <path d="M156 176 L216 92"/>
    <path d="M356 176 L296 92"/>
    <path d="M356 176 L404 92"/>
  </g>
  <g fill="white">
    <circle cx="156" cy="176" r="24"/>
    <circle cx="356" cy="176" r="24"/>
    <circle cx="108" cy="92" r="20"/>
    <circle cx="216" cy="92" r="20"/>
    <circle cx="296" cy="92" r="20"/>
    <circle cx="404" cy="92" r="20"/>
  </g>
  <circle cx="256" cy="262" r="30" fill="#2DD4BF"/>
</svg>
