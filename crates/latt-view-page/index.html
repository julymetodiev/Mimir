<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lantern Lattice view</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230F172A'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%232DD4BF'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; --bg: #020409; --panel: #0f172a8c; --line: #94a3b833; --text: #e2e8f0; --dim: #94a3b8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #labels div { position: absolute; transform: translate(8px, -50%); white-space: nowrap; font-size: 11px;
    text-shadow: 0 0 3px #000, 0 0 3px #000; display: none; }
  #top { position: fixed; top: 12px; left: 12px; width: 280px; }
  #search { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; font: inherit;
    color: var(--text); background: var(--panel); border: 1px solid var(--line); outline: none;
    -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%); }
  #search:focus { border-color: #2dd4bf; }
  #results { margin-top: 4px; border-radius: 8px; background: var(--panel); max-height: 50vh; overflow: auto;
    -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%); }
  #panel { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 380px; padding: 14px;
    box-sizing: border-box; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
    overflow: auto; display: none; box-shadow: 0 12px 48px #0009, inset 0 1px 0 #ffffff14;
    -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
    animation: arrive .22s ease-out; }
  @keyframes arrive { from { opacity: 0; transform: translateX(14px); } }
  @media (prefers-reduced-motion: reduce) { #panel { animation: none; } }
  @media (max-width: 720px) { #panel { left: 12px; width: auto; top: 40vh; } }
  #name { font-size: 16px; font-weight: 600; word-break: break-all; }
  #meta { color: var(--dim); margin: 2px 0 10px; word-break: break-all; }
  #source { margin: 10px 0 0; padding: 10px; border-radius: 8px; background: #02061780; border: 1px solid var(--line); overflow: auto;
    max-height: 40vh; font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre; }
  #source:empty { display: none; }
  #source .ln { color: #475569; user-select: none; }
  #source .k { color: #c084fc; }
  #source .s { color: #86efac; }
  #source .c { color: #7c8aa0; font-style: italic; }
  #source .n { color: #fdba74; }
  #source .t { color: #fcd34d; }
  #source .f { color: #2dd4bf; }
  #source .m { color: #f0abfc; }
  #source .a { color: #94a3b8; }
  #source .l { color: #fda4af; }
  .heading { color: var(--dim); margin-top: 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .item { padding: 3px 8px; border-radius: 4px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item:hover { background: #ffffff14; }
  .item small { color: var(--dim); margin-left: 6px; }
  #status { position: fixed; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 8px;
    background: var(--panel); color: var(--dim); font-size: 12px;
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 0 10px; }
  #problem { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; text-align: center; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="labels"></div>
<div id="top">
  <input id="search" placeholder="Find a symbol" autocomplete="off" spellcheck="false" aria-label="Find a symbol">
  <div id="results"></div>
</div>
<div id="panel">
  <div id="name"></div>
  <div id="meta"></div>
  <div id="lists"></div>
  <pre id="source"></pre>
</div>
<div id="status"><span id="counts">Loading</span><span id="legend"><i style="background:#2dd4bf"></i>function<i style="background:#fabf24"></i>type<i style="background:#94a3b8"></i>member<i style="background:#f573b5"></i>constant</span></div>
<div id="problem"></div>
<script type="module">
  const problem = (text) => {
    const box = document.getElementById("problem");
    box.textContent = text;
    box.style.display = "flex";
  };
  if (!navigator.gpu) {
    problem("This browser has no WebGPU, which the view needs. A current Chrome, Edge or Safari has it.");
  } else {
    try {
      const page = await import("./latt_view_page.js");
      await page.default();
      await page.start();
    } catch (error) {
      problem(`The view could not start: ${error}`);
    }
  }
</script>
</body>
</html>
