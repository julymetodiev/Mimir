[package]
name = "mimir-view-page"
description = "The page of mimir view: the graph, drawn and laid out on the GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mimir-view-wire.workspace = true

# On any other target the crate holds only what can be tested there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = [
    "BinaryType", "CssStyleDeclaration", "Document", "DomRect", "Element", "Event", "EventTarget",
    "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "KeyboardEvent", "Location", "MessageEvent",
    "MouseEvent", "PointerEvent", "Response", "WebSocket", "WheelEvent", "Window", "console",
] }
wgpu = { version = "30.0.1", default-features = false, features = ["webgpu", "wgsl"] }
