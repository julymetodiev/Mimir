[package]
name = "mimir-cli"
description = "CLI for the Mimir semantic code intelligence engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "mimir"
path = "src/main.rs"

[dependencies]
mimir-protocol = { workspace = true }
mimir-client = { workspace = true }
mimir-hook = { workspace = true }
mimir-daemon = { workspace = true }
mimir-mcp = { workspace = true }
mimir-view = { workspace = true }
mimir-parse-core = { workspace = true }
mimir-parse-rust = { workspace = true }
mimir-parse-ts = { workspace = true }
mimir-parse-python = { workspace = true }
mimir-resolve = { workspace = true }
mimir-parse-go = { workspace = true }
mimir-resolve-ra = { workspace = true }
mimir-resolve-go = { workspace = true }
mimir-resolve-lsp = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
mimir-view-wire = { workspace = true }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false }
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
