name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Tag, version and changelog agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-version.sh "${GITHUB_REF_NAME#v}"

  page:
    name: Build the page from its sources
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Tools
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/,"",$3); print $3}' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked
          sudo apt-get update && sudo apt-get install -y binaryen
      - run: scripts/build-page.sh
      - uses: actions/upload-artifact@v7
        with:
          name: page
          path: crates/latt-view/page

  build:
    name: Build ${{ matrix.target }}
    needs: page
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, runs: true }
          - { os: macos-latest, target: x86_64-apple-darwin, runs: false }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, runs: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, runs: true }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: page
          path: crates/latt-view/page
      - name: Build
        run: cargo build --release --locked -p lantern-lattice --target ${{ matrix.target }}
      - name: The binary runs
        if: matrix.runs
        run: target/${{ matrix.target }}/release/latt --version
      - name: Package
        run: |
          name="latt-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/latt" LICENSE README.md CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: latt-${{ matrix.target }}
          path: dist/*.tar.gz

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Only the archives: the page's artifact was for the builds.
      - uses: actions/download-artifact@v8
        with:
          pattern: latt-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version] - " 'index($0, head) == 1 {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Lantern Lattice $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
