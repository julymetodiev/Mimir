name: Pages

# Mimir's own graph as a page, for anyone to look at. Only the code of this repository goes in.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: Publish the view of Mimir's own code
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-analyzer, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p mimir-cli
      - name: Export
        run: target/release/mimir view --export "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v5
